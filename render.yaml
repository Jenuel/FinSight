# Render blueprint for the FinSight Django API.
# The frontend deploys separately on Vercel (see frontend/.env.example for the
# variables it needs).
#
# Secrets policy: every value below is either non-secret config or `sync: false`,
# which means Render prompts for it and stores it in the dashboard. No secret is
# ever committed to this file.

services:
  - type: web
    name: finsight-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health/

    # Migrations run once per deploy, before the new instance takes traffic -
    # not at container start, where concurrent instances would race.
    preDeployCommand: python manage.py migrate --noinput

    envVars:
      # Generated by Render and injected; never seen by a human, never in git.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Set to your Render hostname, e.g. finsight-api.onrender.com
      - key: ALLOWED_HOSTS
        sync: false

      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

      # Your Vercel origin(s), comma-separated, e.g. https://finsight.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Supabase connection string. Rotate the password before first deploy -
      # the previous one was stored in plaintext on a developer machine.
      - key: DATABASE_URL
        sync: false

      # Clerk. CLERK_JWKS_URL is required when DEBUG=False (settings enforce it).
      # CLERK_ISSUER enables `iss` verification; CLERK_AUTHORIZED_PARTIES should
      # be your Vercel origin so tokens minted for another frontend are rejected.
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

      - key: LOG_LEVEL
        value: INFO

      # Render routes traffic to $PORT; the Dockerfile CMD honours it.
      - key: PORT
        value: "8000"
